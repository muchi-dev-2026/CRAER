<!DOCTYPE html>
<html lang="ja">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>CRAER - CRAFT END</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    
    body {
      background-color: #ffffff;
      color: #222222;
      font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
      min-height: 100dvh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      align-items: center;
      padding: 20px 16px 88px;
      -webkit-font-smoothing: antialiased;
    }
    
    .container {
      width: 100%;
      max-width: 420px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      flex: 1;
    }
    
    /* 上部ビジュアル枠 */
    .media-frame {
      width: 100%;
      aspect-ratio: 1 / 1;
      background: radial-gradient(circle at center, #ffffff 40%, #f2f2f2 100%);
      border: 1px solid #e6e6e6;
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    
    .media-frame img,
    .media-frame video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      transform: scale(1.0);
    }
    
    /* 横罫線インフォパネル（白画面版） */
    .info-panel {
      width: 100%;
      padding: 22px 20px 24px;
      background-color: #fafafa;
      border-top: 1px solid #e2e2e2;
      border-bottom: 1px solid #e2e2e2;
      background-image: repeating-linear-gradient(to bottom,
          transparent 0px,
          transparent 31px,
          rgba(0, 0, 0, 0.05) 32px);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
    
    .story-title {
      font-size: 22px;
      font-weight: 500;
      letter-spacing: 0.08em;
      color: #1a1a1a;
    }
    
    .author-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      font-family: Georgia, serif;
      font-style: italic;
      font-size: 13px;
      color: #777777;
      letter-spacing: 0.05em;
    }

    .link-badges {
      display: flex;
      align-items: center;
      gap: 6px;
    }
    
    .social-badge {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      min-width: 22px;
      height: 20px;
      padding: 0 6px;
      border-radius: 4px;
      background-color: #eeeeee;
      color: #555555;
      text-decoration: none;
      font-style: normal;
      font-family: sans-serif;
      font-weight: bold;
      font-size: 11px;
      letter-spacing: 0.02em;
      transition: background-color 0.2s, color 0.2s;
    }
    
    .social-badge:active {
      background-color: #333333;
      color: #ffffff;
    }
    
    .description {
      font-size: 14px;
      line-height: 2.0;
      color: #2b2b2b;
      letter-spacing: 0.04em;
      margin-top: 4px;
    }
    
    .erode-log {
      margin-top: 8px;
      padding-top: 12px;
      border-top: 1px dashed #d8d8d8;
      font-family: "Courier New", monospace;
      font-size: 11.5px;
      line-height: 1.75;
      color: #666666;
    }
    
    .erode-log-title {
      font-size: 10px;
      letter-spacing: 0.15em;
      color: #999999;
      margin-bottom: 4px;
    }
    
    /* 下部案内テキストのみ */
    .footer-area {
      width: 100%;
      max-width: 420px;
      margin-top: 24px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 6px;
      text-align: center;
    }
    
    .close-notice {
      font-size: 13px;
      color: #333333;
      letter-spacing: 0.12em;
    }
    
    .sub-hint {
      font-size: 11px;
      color: #999999;
      letter-spacing: 0.1em;
    }
  </style>
</head>

<body>
  
  <div class="container">
    <!-- 上部ビジュアル -->
    <div class="media-frame">
      <video src="./assets/kaiso.mp4" autoplay muted playsinline loop></video>
    </div>
    
    <!-- 白画面版インフォパネル -->
    <div class="info-panel">
      <div class="story-title">あとがき</div>
      
      <div class="author-row">
        <span>by muchi</span>
        <div class="link-badges">
          <a href="https://www.pixiv.net/users/130183269/" target="_blank" rel="noopener noreferrer" class="social-badge" title="pixiv">P</a>
          <a href="https://x.com/muchidev2026" target="_blank" rel="noopener noreferrer" class="social-badge" title="X">𝕏</a>
          <a href="https://ci-en.dlsite.com/creator/41847" target="_blank" rel="noopener noreferrer" class="social-badge" title="Ci-en">Ci-en</a>
        </div>
      </div>
      
      <div class="description">
        この話は終わりです。初めてゲーム作ったけど、中々面白かったです。処女作にしては頑張った。敵作ってくれた人いるのかな？、わからないけど、まぁいいか、、、
      </div>
      
      <div class="erode-log">
        <div class="erode-log-title">[ERODE LOG]</div>
        完成コード: 4387行<br>
        GitHubコード変更数: 292<br>
        生成画像・動画: 1130<br>
        最長AI対話: 20万文字超<br>
        使ったAI（ゲームコード用: 3つ / ストーリー・セリフ用: 6つ / 動画・画像生成: 10くらい？）
      </div>
    </div>
  </div>
  
  <div class="footer-area">
    <div class="close-notice">ブラウザ閉じてください。</div>
    <div class="sub-hint">次は、あなたの番。</div>
  </div>
  
</body>

</html>
