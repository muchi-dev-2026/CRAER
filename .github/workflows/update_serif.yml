name: Auto Update Dialogue Script

on:
  schedule:
    # 毎日日本時間 朝 6:00 (UTC 21:00)
    - cron: '0 21 * * *'
    # 毎日日本時間 昼 12:00 (UTC 3:00)
    - cron: '0 3 * * *'
    # 毎日日本時間 夜 21:00 (UTC 12:00)
    - cron: '0 12 * * *'
  workflow_dispatch: # 手動で動かすボタンを有効化

jobs:
  update-dialogue:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install google-genai

      - name: Generate Dialogue
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python generate_serif.py

      - name: Commit and Push
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add assets/book_serif.txt assets/book_info.txt
          git diff --quiet && git diff --staged --quiet || (git commit -m "Chore: 時間帯別の自動生成されたbookセリフとインフォの更新" && git push)
